name: Publish packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Set up npm trusted publishing
        run: npm install --global npm@11

      - name: Install dependencies
        run: npm ci

      - name: Validate release
        run: npm run format:check && npm run typecheck && npm test && npm run build

      - name: Pack release artifacts
        run: |
          mkdir -p artifacts
          npm pack --workspace @danixts/border-beam --pack-destination artifacts
          npm pack --workspace @danixts/liquid-gooey --pack-destination artifacts

      - name: Publish unpublished versions
        shell: bash
        run: |
          publish_if_new() {
            local workspace="$1"
            local package_name version
            package_name="$(node -p "require('./${workspace}/package.json').name")"
            version="$(node -p "require('./${workspace}/package.json').version")"

            if npm view "${package_name}@${version}" version >/dev/null 2>&1; then
              echo "${package_name}@${version} is already public; skipping"
            else
              npm publish --workspace "${package_name}" --access public
            fi
          }

          publish_if_new packages/border-beam
          publish_if_new packages/liquid-gooey

      - name: Attach packages to GitHub Release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" artifacts/*.tgz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
