name: Deploy playgrounds

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build playgrounds
        run: npm run build:playgrounds

      - name: Assemble Pages site
        run: |
          mkdir -p playground-dist/beam playground-dist/gooey
          cp -R sites/beam/dist/. playground-dist/beam/
          cp -R sites/gooey/dist/. playground-dist/gooey/
          cp sites/index.html playground-dist/index.html
          touch playground-dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload playgrounds
        uses: actions/upload-pages-artifact@v3
        with:
          path: playground-dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
